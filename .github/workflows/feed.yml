name: Mirno feed

# Besplatno: GitHub Actions pokreće generator po rasporedu, u SVOM sandboxu
# (neprijateljski podaci se NE diraju na tvom računaru). Rezultat: feed.json.
on:
  schedule:
    - cron: "*/30 * * * *" # svakih ~30 min
  workflow_dispatch: {} # ručno pokretanje iz Actions taba

permissions:
  contents: write

concurrency:
  group: mirno-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Generiši feed
        run: python3 -I build_feed.py
      - name: Commit ako ima promjena
        run: |
          git config user.name "mirno-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "feed: update $(date -u +%FT%TZ)"
          git push
